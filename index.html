<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<meta name="description" content="Matter Playground Phase 2 — a full-screen interactive material physics sandbox.">
<title>Matter Playground — Phase 02</title>
<style>
:root{color-scheme:dark;--bg:#080b09;--panel:#121814;--line:#344039;--muted:#98a79c;--text:#edf5ee;--lime:#cafa80;--lime2:#93ce4c;--glass:rgba(10,15,12,.97);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none}
button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
#game{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#172219 0%,#0a0e0c 72%);overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated;will-change:transform}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#game.vfx-impact{animation:impactFlash .34s ease-out}
@keyframes impactFlash{0%,100%{filter:brightness(1)}12%{filter:brightness(1.85) saturate(1.5)}38%{filter:brightness(1.15)}}
.sound-on{border-color:#cafa80!important;color:#cafa80!important;box-shadow:0 0 0 1px #cafa8030,0 0 18px #cafa8020!important}
#sfx{position:relative;overflow:hidden}
#sfx:after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 35%,#ffffff17 48%,transparent 60%);transform:translateX(-100%);transition:transform .5s}
#sfx:hover:after{transform:translateX(100%)}
#game.blast{animation:blastFlash .24s ease-out}
#world.blast{animation:worldShake .24s ease-out}
@keyframes blastFlash{0%,100%{filter:brightness(1)}18%{filter:brightness(1.55) saturate(1.25)}}
@keyframes worldShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}42%{transform:translateX(3px)}65%{transform:translateX(-1px)}}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,5,.35),transparent 22%,transparent 72%,rgba(4,7,5,.5));z-index:1}
.topbar{position:absolute;z-index:4;top:calc(var(--safe-top) + 10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:9px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;min-width:0;padding:7px 12px 7px 8px;border:1px solid #ffffff19;background:var(--glass);backdrop-filter:none;border-radius:16px;box-shadow:0 8px 28px #0003;animation:dropIn .48s cubic-bezier(.2,.8,.2,1) both}
.logo{height:32px;width:32px;flex:0 0 32px;border-radius:11px;background:linear-gradient(145deg,#e0ffac,#93cb49);color:#18240e;display:grid;place-items:center;box-shadow:inset 0 1px 1px #fff9,0 4px 12px #b9f36d22}
.brandtitle{font-weight:850;font-size:12px;letter-spacing:-.035em;white-space:nowrap}.brandtitle span{color:var(--lime)}.brandmeta{font-size:9px;color:#a5b2a7;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.topactions{display:flex;align-items:center;gap:7px}
.pill{height:40px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:13px;border:1px solid #ffffff20;background:var(--glass);backdrop-filter:none;box-shadow:0 8px 24px #0003;font-size:11px;font-weight:750;white-space:nowrap}
.liveDot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px #cafa80aa;animation:livePulse 2s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 13px;border-radius:13px;border:1px solid #ffffff25;background:linear-gradient(180deg,#2a342d,#171e19);box-shadow:inset 0 1px 0 #ffffff20,0 4px 0 #080b09,0 7px 15px #0003;color:#edf5ee;font-size:11px;font-weight:800;transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s,box-shadow .16s,border-color .16s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);border-color:#8da77e88;transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff15,0 1px 0 #080b09,0 3px 8px #0003}
.btn.primary{color:#18220f;background:linear-gradient(180deg,#d9ffa0,#a9e562);border-color:#e3ffb8;box-shadow:inset 0 1px 0 #ffffffb0,0 4px 0 #628a32,0 8px 18px #a5df5a20}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{width:40px;padding:0;flex:0 0 40px}
.btn.active{border-color:#d0ff89;color:var(--lime);background:linear-gradient(180deg,#35432e,#1a2417)}
#stats{position:absolute;z-index:3;top:68px;left:14px;display:flex;gap:6px;pointer-events:none;animation:fadeUp .55s .12s both}
.stat{padding:7px 10px;border-radius:11px;border:1px solid #ffffff15;background:rgba(8,13,10,.56);backdrop-filter:none;font-size:10px;color:#9eaea1;font-variant-numeric:tabular-nums}
.stat b{color:#f0f7f0;font-size:11px;margin-left:4px}
#message{position:absolute;z-index:7;top:calc(var(--safe-top) + 72px);left:50%;transform:translate(-50%,-7px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:13px;border:1px solid #cafa8055;background:#172116ed;color:#eaffd0;box-shadow:0 10px 35px #0005;font-size:11px;font-weight:750;white-space:nowrap;transition:opacity .2s,transform .2s cubic-bezier(.2,.8,.2,1);backdrop-filter:none}
#message.show{opacity:1;transform:translate(-50%,0)}
.bottom{position:absolute;z-index:4;bottom:calc(var(--safe-bottom) + 12px);left:12px;right:12px;display:flex;flex-direction:column;align-items:stretch;gap:8px;animation:riseIn .55s .08s cubic-bezier(.2,.8,.2,1) both}
.toolrow{align-self:center;display:flex;align-items:center;gap:8px;padding:7px;border:1px solid #ffffff1c;background:var(--glass);backdrop-filter:none;border-radius:16px;box-shadow:0 12px 35px #0005;max-width:100%}
.toolrow .divider{height:25px;width:1px;background:#ffffff20;margin:0 1px}
.brushgroup{display:flex;align-items:center;gap:8px;padding:0 7px}.brushlabel{font-size:9px;color:#a6b4a9;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.brushgroup input{width:90px;accent-color:var(--lime);height:18px}.brushnum{font-size:10px;color:var(--lime);font-weight:800;min-width:16px}
.materialdock{display:flex;align-items:stretch;justify-content:center;gap:7px;padding:8px;border:1px solid #ffffff1c;background:var(--glass);backdrop-filter:none;border-radius:18px;box-shadow:0 12px 35px #0005;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;max-width:100%}
.materialdock::-webkit-scrollbar{display:none}
.material{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:66px;height:64px;padding:6px 8px;border-radius:13px;border:1px solid transparent;background:linear-gradient(180deg,#ffffff0a,#ffffff03);transition:transform .17s cubic-bezier(.2,.8,.2,1),background .17s,border-color .17s,box-shadow .17s;flex:0 0 auto}
.material:hover{transform:translateY(-2px);background:#ffffff0d}
.material:active{transform:scale(.94)}
.material.selected{background:linear-gradient(180deg,#33432a,#202b1b);border-color:#bdf176;box-shadow:inset 0 1px 0 #ffffff25,0 0 0 1px #bdf17615,0 5px 16px #bdf17612;animation:selectPop .24s cubic-bezier(.2,.8,.2,1)}
.material.selected:after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px #cafa80}
.material .emoji{font-size:22px;line-height:1;filter:drop-shadow(0 3px 3px #0006);transition:transform .18s}
.material:hover .emoji{transform:translateY(-1px) scale(1.08)}
.material .label{font-size:10px;font-weight:750;color:#d7e2d8}
.material.selected .label{color:#e8ffd1}
#orientation{display:none;position:absolute;z-index:9;inset:0;background:rgba(7,11,8,.97);align-items:center;justify-content:center;text-align:center;padding:24px}
.orientcard{max-width:280px}.orienticon{font-size:36px;animation:tilt 1.8s ease-in-out infinite}.orienttitle{font-size:18px;font-weight:850;margin:14px 0 7px}.orientcopy{font-size:12px;color:#a7b4aa;line-height:1.6}
#hint{position:absolute;z-index:2;left:50%;top:43%;transform:translate(-50%,-50%);pointer-events:none;color:#a6b6a7;font-size:11px;text-align:center;line-height:1.7;opacity:0;transition:opacity .4s;text-shadow:0 2px 8px #000}
#message.show{animation:toastPulse .3s ease-out}
@keyframes toastPulse{0%{filter:brightness(1.5);box-shadow:0 0 0 0 #cafa8044,0 10px 35px #0005}100%{filter:brightness(1);box-shadow:0 10px 35px #0005}}
.materialdock{box-shadow:0 8px 20px #0003}
@media(max-width:760px) and (orientation:portrait){.materialdock{box-shadow:0 5px 14px #0003}.toolrow{box-shadow:0 5px 14px #0003}.material.selected{box-shadow:inset 0 1px 0 #ffffff20,0 0 0 1px #bdf17615}}
#hint.show{opacity:.8}
#hint strong{color:#e8f6e4}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 11px #cafa80aa}50%{opacity:.5;box-shadow:0 0 3px #cafa8055}}
@keyframes selectPop{0%{transform:scale(.92)}65%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media(max-width:760px){.topbar{top:calc(var(--safe-top) + 7px);left:7px;right:7px}.brand{padding:6px 9px 6px 6px;gap:7px}.logo{width:29px;height:29px;flex-basis:29px}.brandtitle{font-size:10px}.brandmeta{font-size:8px}.pill{height:36px;padding:0 9px;font-size:10px}.btn{min-height:36px;padding:0 10px;border-radius:11px}.btn.icon{width:36px;flex-basis:36px}.topactions{gap:5px}#stats{top:55px;left:8px}.stat{padding:6px 8px;font-size:9px}.stat b{font-size:10px}.bottom{left:6px;right:6px;bottom:calc(var(--safe-bottom) + 6px);gap:6px}.toolrow{padding:5px;gap:5px;border-radius:13px}.toolrow .btn{min-height:33px;padding:0 9px;font-size:10px}.toolrow .btn.icon{width:33px;flex-basis:33px}.brushgroup{gap:5px;padding:0 4px}.brushlabel{font-size:8px}.brushgroup input{width:66px}.materialdock{justify-content:flex-start;gap:4px;padding:5px;border-radius:14px}.material{min-width:56px;height:56px;gap:4px;padding:5px}.material .emoji{font-size:19px}.material .label{font-size:9px}}
@media(max-width:760px) and (orientation:portrait){
 #orientation{display:none!important}
 .topbar{top:calc(var(--safe-top) + 5px);left:5px;right:5px;gap:4px}
 .brand{padding:5px;gap:5px;border-radius:12px}.logo{width:25px;height:25px;flex-basis:25px;border-radius:8px}
 .brandtitle{font-size:9px}.brandmeta{display:none}
 .topactions{gap:4px}.pill{height:31px;padding:0 7px;font-size:9px;gap:5px}.btn.icon{width:31px;flex-basis:31px;min-height:31px}
 #stats{top:43px;left:5px;gap:4px}.stat{padding:4px 6px;font-size:8px;border-radius:8px}.stat b{font-size:9px}
 .bottom{left:4px;right:4px;bottom:calc(var(--safe-bottom) + 4px);gap:4px}
 .toolrow{align-self:stretch;width:100%;max-width:100%;flex-wrap:wrap;justify-content:center;padding:4px;gap:4px;border-radius:12px;background:rgba(10,15,12,.86)}
 .toolrow .btn{min-height:29px;height:29px;padding:0 8px;font-size:9px;border-radius:9px}
 .toolrow .btn.icon{width:29px;flex-basis:29px;min-height:29px}
 .toolrow .divider{height:20px}
 .brushgroup{gap:4px;padding:0 3px}.brushlabel{font-size:7px}.brushgroup input{width:58px;height:15px}.brushnum{font-size:9px}
 .materialdock{justify-content:flex-start;gap:3px;padding:4px;border-radius:12px;background:rgba(10,15,12,.88)}
 .material{min-width:47px;height:47px;gap:3px;padding:3px;border-radius:9px}
 .material .emoji{font-size:17px}.material .label{font-size:8px}
 #message{top:calc(var(--safe-top) + 65px);max-width:calc(100vw - 24px);white-space:normal;text-align:center}
 #hint{top:38%;font-size:10px}
}
@media(max-height:480px) and (orientation:landscape){.topbar{top:calc(var(--safe-top) + 5px)}.brand{padding:4px 8px 4px 5px}.logo{width:26px;height:26px;flex-basis:26px}.brandmeta{display:none}.pill,.btn{height:32px;min-height:32px}.btn.icon{width:32px;flex-basis:32px}.bottom{bottom:calc(var(--safe-bottom) + 5px);gap:4px}.materialdock{padding:4px;gap:4px}.material{height:46px;min-width:54px;gap:3px}.material .emoji{font-size:17px}.toolrow{padding:4px}.toolrow .btn{min-height:29px}.brushgroup input{width:62px}#stats{top:46px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="game">
 <canvas id="world" aria-label="Matter Playground simulation. Touch or drag to paint materials."></canvas>
 <div class="vignette"></div>
 <canvas id="fx" aria-hidden="true"></canvas>
 <header class="topbar">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 5-12 3 8 3-6 5 10H4Z"/><path d="M7 20h10"/></svg></div><div><div class="brandtitle">MATTER<span>PLAYGROUND</span></div><div class="brandmeta">PHASE 02 · REACTIVE WORLD</div></div></div>
  <div class="topactions"><div class="pill"><i class="liveDot"></i><span id="state">LIVE</span></div><button class="btn icon" id="pause" aria-label="Pause simulation" title="Pause / resume"><svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM15 5h4v14h-4z"/></svg></button><button class="btn icon" id="reset" aria-label="Reset world" title="Reset world"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>
 </header>
 <div id="stats"><div class="stat">MATTER <b id="count">0</b></div><div class="stat">FPS <b id="fps">60</b></div><div class="stat">REACTIONS <b id="reactions">0</b></div></div>
 <div id="hint"><strong>TOUCH + DRAG</strong> to paint<br>Tap a material below to switch</div>
 <div id="message" role="status"></div>
 <footer class="bottom">
  <div class="toolrow">
   <button class="btn primary" id="rain"><span>☂</span> Rain</button>
   <button class="btn" id="ignite"><span>♨</span> Ignite</button>
   <button class="btn" id="garden"><span>✿</span> Grow</button>
   <div class="divider"></div>
   <div class="brushgroup"><span class="brushlabel">Brush</span><input id="brush" type="range" min="1" max="9" value="3" aria-label="Brush size"><span class="brushnum" id="brushnum">3</span></div>
   <div class="divider"></div>
   <button class="btn icon" id="sfx" title="Toggle sound effects" aria-label="Toggle sound effects"><svg id="sfxIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a5 5 0 0 1 0 6"/></svg></button>
   <button class="btn icon" id="speed" title="Simulation speed" aria-label="Simulation speed">1×</button>
  </div>
  <nav class="materialdock" id="dock" aria-label="Material selection"></nav>
 </footer>
 <div id="orientation"><div class="orientcard"><div class="orienticon">▱</div><div class="orienttitle">Rotate for the full world</div><div class="orientcopy">Matter Playground is designed for landscape. Turn your phone sideways for a wider simulation and easier controls.</div><button class="btn primary" id="continuePortrait" style="margin-top:18px">Continue in portrait</button></div></div>
</div>
<script>
(function(){
'use strict';
const W=240,H=135,SIZE=W*H;
const E=0,SAND=1,WATER=2,STONE=3,WOOD=4,FIRE=5,PLANT=6,OIL=7,STEAM=8,ACID=9,LAVA=10,ICE=11,SMOKE=12,ERASER=13,GLASS=14,GUNPOWDER=15;
const materials=[
{id:SAND,name:'Sand',emoji:'🟨',color:'#e5bd70'},
{id:WATER,name:'Water',emoji:'💧',color:'#48bce9'},
{id:STONE,name:'Stone',emoji:'🪨',color:'#8d9b9b'},
{id:GLASS,name:'Glass',emoji:'🔷',color:'#b9e9ef'},
{id:WOOD,name:'Wood',emoji:'🪵',color:'#a66c42'},
{id:FIRE,name:'Fire',emoji:'🔥',color:'#ff8a42'},
{id:GUNPOWDER,name:'Powder',emoji:'💣',color:'#9a8b7b'},
{id:PLANT,name:'Plant',emoji:'🌿',color:'#79c75a'},
{id:OIL,name:'Oil',emoji:'🛢️',color:'#d7ce69'},
{id:ACID,name:'Acid',emoji:'🧪',color:'#a7f65b'},
{id:LAVA,name:'Lava',emoji:'🌋',color:'#ff582f'},
{id:ICE,name:'Ice',emoji:'🧊',color:'#a9eaff'},
{id:STEAM,name:'Steam',emoji:'☁️',color:'#c2d5dc'},
{id:SMOKE,name:'Smoke',emoji:'🌫️',color:'#89928f'},
{id:ERASER,name:'Eraser',emoji:'⌫',color:'#f0a9c8'}
];
let cells=new Uint8Array(SIZE),burn=new Uint8Array(SIZE),processed=new Uint8Array(SIZE);
let selected=SAND,brush=3,paused=false,speed=1,age=0,reactionCount=0,frameCount=0,lastFps=performance.now(),lastAge=performance.now(),lastHint=0,toastTimer=0,forcePortrait=false;
const $=id=>document.getElementById(id);
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false}),off=document.createElement('canvas');off.width=W;off.height=H;const octx=off.getContext('2d',{alpha:false});const pixels=octx.createImageData(W,H);
const fxCanvas=$('fx'),fxCtx=fxCanvas.getContext('2d');let fxParticles=[],lastFXPaint=0,audioCtx=null,audioEnabled=false,noiseBuffer=null;
const ui={dock:$('dock'),count:$('count'),fps:$('fps'),reactions:$('reactions'),state:$('state'),pause:$('pause'),pauseIcon:$('pauseIcon'),brush:$('brush'),brushnum:$('brushnum'),speed:$('speed'),message:$('message'),hint:$('hint')};
const idx=(x,y)=>y*W+x,inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
function get(x,y){return inside(x,y)?cells[idx(x,y)]:STONE}
function empty(x,y){return inside(x,y)&&cells[idx(x,y)]===E}
function set(x,y,v){if(inside(x,y)){const k=idx(x,y);cells[k]=v;burn[k]=v===FIRE?1:0}}
function notify(text){ui.message.textContent=text;ui.message.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.message.classList.remove('show'),1550)}
function spawnFX(x,y,type,count=5){const palette={water:['#8de8ff','#37b9ff','#e3fbff'],sand:['#f6d89a','#c89b51'],fire:['#ffb347','#ff6338','#fff2a1'],lava:['#ff512f','#ffb02e','#fff0a0'],acid:['#c8ff62','#77ffbc'],stone:['#b9c7c4','#f2fff6'],powder:['#ffc17a','#ff6b39','#e8e8d8'],steam:['#d6e8ed','#ffffff'],smoke:['#aab6b0','#65746c'],plant:['#a5f26b','#4fbb59'],ui:['#cafa80','#ffffff']};const colors=palette[type]||palette.ui;for(let i=0;i<count&&fxParticles.length<300;i++){const angle=Math.random()*Math.PI*2,force=(type==='explosion'?1.1:.15)+Math.random()*(type==='explosion'?2.6:.85);fxParticles.push({x,y,vx:Math.cos(angle)*force,vy:Math.sin(angle)*force-(type==='fire'||type==='lava'||type==='steam'?0.5:0),life:type==='explosion'?.35+Math.random()*.45:.28+Math.random()*.48,maxLife:type==='explosion'?.8:.76,size:type==='explosion'?1.4+Math.random()*2:0.35+Math.random()*1.35,color:colors[(Math.random()*colors.length)|0],kind:type==='explosion'&&i===0?'ring':'dot',gravity:type==='water'?.045:type==='sand'?.065:type==='explosion'?.035:-.018})}}
function impactFX(x,y){const g=$('game');g.classList.remove('vfx-impact');void g.offsetWidth;g.classList.add('vfx-impact');setTimeout(()=>g.classList.remove('vfx-impact'),360);spawnFX(x,y,'explosion',34);spawnFX(x,y,'fire',18)}
function renderFX(){const sx=fxCanvas.width/W,sy=fxCanvas.height/H;fxCtx.setTransform(sx,0,0,sy,0,0);fxCtx.clearRect(0,0,W,H);fxCtx.globalCompositeOperation='lighter';for(let i=fxParticles.length-1;i>=0;i--){const p=fxParticles[i];p.life-=.016;if(p.life<=0){fxParticles.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=.985;const alpha=Math.max(0,p.life/p.maxLife);fxCtx.globalAlpha=alpha;if(p.kind==='ring'){fxCtx.strokeStyle=p.color;fxCtx.lineWidth=.7+alpha;fxCtx.shadowColor=p.color;fxCtx.shadowBlur=8;fxCtx.beginPath();fxCtx.arc(p.x,p.y,(1-alpha)*13+1,0,Math.PI*2);fxCtx.stroke();fxCtx.shadowBlur=0}else{fxCtx.fillStyle=p.color;fxCtx.shadowColor=p.color;fxCtx.shadowBlur=2+p.size*2;fxCtx.beginPath();fxCtx.arc(p.x,p.y,p.size*(.45+alpha*.6),0,Math.PI*2);fxCtx.fill();fxCtx.shadowBlur=0}}fxCtx.globalAlpha=1;fxCtx.globalCompositeOperation='source-over'}
function ambientFX(){if(frameCount%3!==0)return;for(let i=0;i<95;i++){const x=(Math.random()*W)|0,y=(Math.random()*H)|0,v=cells[idx(x,y)];if(v===FIRE&&Math.random()<.12)spawnFX(x,y,'fire',1);else if(v===LAVA&&Math.random()<.16)spawnFX(x,y,'lava',1);else if(v===ACID&&Math.random()<.018)spawnFX(x,y,'acid',1);else if((v===STEAM||v===SMOKE)&&Math.random()<.025)spawnFX(x,y,v===STEAM?'steam':'smoke',1)}} 
function initAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();const len=Math.floor(audioCtx.sampleRate*.45);noiseBuffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const arr=noiseBuffer.getChannelData(0);for(let i=0;i<len;i++)arr[i]=Math.random()*2-1}
function playSfx(kind='ui'){if(!audioEnabled)return;initAudio();if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const gain=audioCtx.createGain();gain.connect(audioCtx.destination);const vol=kind==='explosion'?.34:kind==='fire'?.09:.12;gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.001,t+(kind==='explosion'?.42:.13));if(kind==='explosion'||kind==='fire'){const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter();src.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.setValueAtTime(kind==='explosion'?700:1800,t);filter.frequency.exponentialRampToValueAtTime(100,t+.35);src.connect(filter);filter.connect(gain);src.start(t);src.stop(t+.44)}else{const osc=audioCtx.createOscillator();osc.type=kind==='water'?'sine':kind==='acid'?'triangle':'sine';const start=kind==='water'?620:kind==='select'?680:kind==='acid'?300:kind==='lava'?110:kind==='stone'?160:kind==='plant'?520:kind==='sand'?230:440;osc.frequency.setValueAtTime(start,t);osc.frequency.exponentialRampToValueAtTime(Math.max(45,start*.48),t+.13);osc.connect(gain);osc.start(t);osc.stop(t+.15)}}
function blastEffect(){const g=document.getElementById('game');g.classList.remove('blast');canvas.classList.remove('blast');void g.offsetWidth;g.classList.add('blast');canvas.classList.add('blast');setTimeout(()=>{g.classList.remove('blast');canvas.classList.remove('blast')},260)}
function reaction(text){reactionCount++;ui.reactions.textContent=reactionCount;notify(text);if(/BLAST|explosion/i.test(text))playSfx('explosion');else if(/acid|dissolv/i.test(text))playSfx('acid');else if(/lava|superheat|rock/i.test(text))playSfx('lava');else if(/rain|water|rainfall/i.test(text))playSfx('water');else if(/garden|plant|life/i.test(text))playSfx('plant');else playSfx('fire');if(/BLAST|explosion|Ignition|Rainfall/i.test(text))spawnFX(W*.5,H*.45,/Rainfall/i.test(text)?'water':/Ignition/i.test(text)?'fire':'explosion',/Rainfall/i.test(text)?18:24)}
function choose(id){selected=id;renderDock();playSfx('select');spawnFX(W*.5,H-14,'ui',3);const b=ui.dock.querySelector('[data-id="'+id+'"]');if(b)b.scrollIntoView({block:'nearest',inline:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function renderDock(){ui.dock.innerHTML='';materials.forEach(m=>{const b=document.createElement('button');b.className='material'+(selected===m.id?' selected':'');b.dataset.id=m.id;b.setAttribute('aria-label','Select '+m.name);b.setAttribute('aria-pressed',selected===m.id?'true':'false');b.innerHTML='<span class="emoji">'+m.emoji+'</span><span class="label">'+m.name+'</span>';b.addEventListener('click',()=>choose(m.id));ui.dock.appendChild(b)})}
renderDock();
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));fxCanvas.width=canvas.width;fxCanvas.height=canvas.height;ctx.imageSmoothingEnabled=false;fxCtx.imageSmoothingEnabled=true}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,100));new ResizeObserver(resize).observe(canvas);resize();
function brushAt(cx,cy,type){const rad=brush-1;for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){if(dx*dx+dy*dy>rad*rad+1)continue;const x=cx+dx,y=cy+dy;if(!inside(x,y))continue;const k=idx(x,y);if(type===ERASER){cells[k]=E;burn[k]=0;continue}if(cells[k]===E||type===WATER||type===SAND||type===OIL||type===ACID||type===STEAM||type===SMOKE||type===FIRE||type===LAVA){cells[k]=type;burn[k]=type===FIRE?1:0}}}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/Math.max(1,r.width)*W))),y:Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/Math.max(1,r.height)*H)))}}
let drawing=false,lastPoint=null,drawType=SAND,drawPointer=null;
function line(a,b,type){let x=a.x,y=a.y;const dx=Math.abs(b.x-x),sx=x<b.x?1:-1,dy=-Math.abs(b.y-y),sy=y<b.y?1:-1;let err=dx+dy;for(let i=0;i<Math.max(dx,-dy)+1;i++){brushAt(x,y,type);if(x===b.x&&y===b.y)break;const e2=2*err;if(e2>=dy){err+=dy;x+=sx}if(e2<=dx){err+=dx;y+=sy}}}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0&&e.button!==2)return;e.preventDefault();drawing=true;drawPointer=e.pointerId;drawType=(e.button===2)?ERASER:selected;lastPoint=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}line(lastPoint,lastPoint,drawType);if(drawType!==ERASER){spawnFX(lastPoint.x,lastPoint.y,drawType===WATER?'water':drawType===FIRE?'fire':drawType===LAVA?'lava':drawType===ACID?'acid':drawType===GUNPOWDER?'powder':'sand',5);playSfx(drawType===WATER?'water':drawType===FIRE?'fire':drawType===LAVA?'lava':drawType===ACID?'acid':'ui')}});
canvas.addEventListener('pointermove',e=>{const p=point(e);if(drawing&&e.pointerId===drawPointer){e.preventDefault();line(lastPoint||p,p,drawType);if(performance.now()-lastFXPaint>38&&drawType!==ERASER){spawnFX(p.x,p.y,drawType===WATER?'water':drawType===FIRE?'fire':drawType===LAVA?'lava':drawType===ACID?'acid':drawType===GUNPOWDER?'powder':'sand',2);lastFXPaint=performance.now()}lastPoint=p}});
function stopDraw(e){if(!e||e.pointerId===drawPointer){drawing=false;lastPoint=null;drawPointer=null}}
canvas.addEventListener('pointerup',stopDraw);canvas.addEventListener('pointercancel',stopDraw);canvas.addEventListener('lostpointercapture',stopDraw);canvas.addEventListener('contextmenu',e=>e.preventDefault());
ui.brush.addEventListener('input',()=>{brush=Number(ui.brush.value);ui.brushnum.textContent=brush});
function swap(a,b){if(a===b)return;const t=cells[a];cells[a]=cells[b];cells[b]=t;const bt=burn[a];burn[a]=burn[b];burn[b]=bt;processed[a]=1;processed[b]=1}
function tryFall(x,y,k,dirs){for(const dx of dirs){const nx=x+dx,ny=y+1;if(empty(nx,ny)){swap(k,idx(nx,ny));return true}}return false}
function updateCell(x,y){const k=idx(x,y),v=cells[k];if(v===E||processed[k])return;
if(v===SAND||v===GUNPOWDER){if(empty(x,y+1)){swap(k,idx(x,y+1));return}if(tryFall(x,y,k,Math.random()<.5?[-1,1]:[1,-1]))return}
else if(v===WATER||v===OIL||v===ACID||v===LAVA){const below=get(x,y+1);if(empty(x,y+1)){swap(k,idx(x,y+1));return}
if(v===WATER||v===OIL||v===ACID){if(below===SAND&&v===WATER&&Math.random()<.015){cells[idx(x,y+1)]=STONE;reaction('Water compacted loose sand.')}
if(tryFall(x,y,k,Math.random()<.5?[-1,1]:[1,-1]))return;
const spread=v===ACID?5:4;const dir=Math.random()<.5?-1:1;for(let n=1;n<=spread;n++){if(empty(x+dir*n,y)){swap(k,idx(x+dir*n,y));return}if(!empty(x+dir*n,y))break}for(let n=1;n<=spread;n++){if(empty(x-dir*n,y)){swap(k,idx(x-dir*n,y));return}if(!empty(x-dir*n,y))break}}
else{if(below===WATER||below===OIL){cells[idx(x,y+1)]=STONE;cells[k]=FIRE;burn[k]=1;reaction('Lava superheated nearby liquid!');return}if(tryFall(x,y,k,Math.random()<.5?[-1,1]:[1,-1]))return;}}
else if(v===STEAM||v===SMOKE){if(v===STEAM&&Math.random()<.008){cells[k]=WATER;return}if(Math.random()<.018){cells[k]=E;return}if(empty(x,y-1)){swap(k,idx(x,y-1));return}const dir=Math.random()<.5?-1:1;if(empty(x+dir,y-1)){swap(k,idx(x+dir,y-1));return}if(empty(x+dir,y)){swap(k,idx(x+dir,y));return}}
else if(v===FIRE){burn[k]++;if(Math.random()<.09){cells[k]=SMOKE;burn[k]=0;return}if(burn[k]>20+Math.random()*35){cells[k]=E;burn[k]=0;return}for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(!inside(nx,ny))continue;const nk=idx(nx,ny),n=cells[nk];if(n===GUNPOWDER&&Math.random()<.09){for(let ey=-3;ey<=3;ey++)for(let ex=-3;ex<=3;ex++){const bx=nx+ex,by=ny+ey;if(!inside(bx,by)||ex*ex+ey*ey>10)continue;const bi=idx(bx,by),bv=cells[bi];if(bv===STONE||bv===GLASS)continue;if(Math.random()<.62){cells[bi]=Math.random()<.62?FIRE:SMOKE;burn[bi]=cells[bi]===FIRE?1:0}else if(bv!==E)cells[bi]=E}impactFX(nx,ny);playSfx('explosion');reaction('POWDER BLAST!');return}if((n===WOOD||n===PLANT||n===OIL)&&Math.random()<(n===OIL?.16:.035)){cells[nk]=FIRE;burn[nk]=1;if(Math.random()<.035)reaction('Combustion: fire spread to '+(n===WOOD?'wood':n===PLANT?'plant matter':'oil')+'.')}if(n===WATER&&Math.random()<.04){cells[k]=STEAM;return}if(n===ICE&&Math.random()<.035){cells[nk]=WATER;cells[k]=SMOKE;return}}}
else if(v===PLANT){if(Math.random()<.018){const dirs=[[0,-1],[-1,0],[1,0]];for(const [dx,dy] of dirs){const nx=x+dx,ny=y+dy;if(empty(nx,ny)&&Math.random()<.45){cells[idx(nx,ny)]=PLANT;break}}}}
else if(v===ICE){if(Math.random()<.004){cells[k]=WATER;return}if(get(x,y+1)===WATER&&empty(x,y+1)&&Math.random()<.02)swap(k,idx(x,y+1))}
if(v===ACID){for(const [dx,dy] of [[0,1],[1,0],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inside(nx,ny))continue;const nk=idx(nx,ny),n=cells[nk];if((n===STONE||n===WOOD||n===SAND||n===ICE)&&Math.random()<.025){cells[nk]=E;if(Math.random()<.08)reaction('Acid dissolved '+(n===STONE?'stone':n===WOOD?'wood':n===ICE?'ice':'sand')+'.')}}}
if(v===LAVA){for(const [dx,dy] of [[0,1],[1,0],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inside(nx,ny))continue;const nk=idx(nx,ny),n=cells[nk];if(n===SAND&&Math.random()<.12)cells[nk]=STONE;else if((n===WOOD||n===PLANT||n===OIL||n===ICE)&&Math.random()<.09){cells[nk]=n===ICE?WATER:FIRE;burn[nk]=n===ICE?0:1}}if(Math.random()<.012){cells[k]=STONE;reaction('Lava cooled into solid rock.')}}}
function simulate(){for(let s=0;s<speed;s++){processed.fill(0);for(let y=H-1;y>=0;y--){const rev=Math.random()<.5;for(let j=0;j<W;j++){const x=rev?W-1-j:j;updateCell(x,y)}}}}
function rgb(hex){const h=hex.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const colors={0:'#0b110d',1:'#e5bd70',2:'#3da9e0',3:'#7d8b88',4:'#a66c42',5:'#ff7a32',6:'#64bb50',7:'#c5b84e',8:'#b9cbd2',9:'#a9f64d',10:'#ff4e29',11:'#a9eaff',12:'#89928f',14:'#b9e9ef',15:'#9a8b7b'};
const rgbCache={};for(const key in colors)rgbCache[key]=rgb(colors[key]);
function render(){const data=pixels.data;let count=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=idx(x,y),v=cells[k],p=k*4;if(v!==E)count++;let r,g,b;if(v===E){const haze=Math.floor(4*Math.max(0,1-Math.abs(x-W*.5)/(W*.7)));const grain=((k*17+x*11+y*7)%13===0)?2:0;r=13+haze+grain;g=23+haze+grain;b=16+haze+grain;if(x%12===0||y%12===0){r+=5;g+=7;b+=5}if((k*3)%7===0){r+=1;g+=2;b+=1}}else{const base=rgbCache[v]||rgbCache[0],q=((k*17+x*7+y*3)%15)-7;const surface=get(x,y-1)===E,edge=get(x-1,y)===E||get(x+1,y)===E;const lit=surface?20:0;const shade=get(x,y+1)===E?-5:0;r=base[0]+q+lit+shade;g=base[1]+q+lit+shade;b=base[2]+q+lit+shade;if(edge){r+=3;g+=4;b+=3}if(v===FIRE){r=255;g=70+((k*19+y*31)%150);b=12+((k*7)%28)}else if(v===LAVA){r=255;g=52+((k*7+y*13)%105);b=10+((k*3)%20)}else if(v===WATER){r=24+q*.2;g=139+q*1.1;b=204+q*1.4}r=Math.max(0,Math.min(255,r|0));g=Math.max(0,Math.min(255,g|0));b=Math.max(0,Math.min(255,b|0))}data[p]=r;data[p+1]=g;data[p+2]=b;data[p+3]=255}octx.putImageData(pixels,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(off,0,0,canvas.width,canvas.height);if(frameCount%8===0)ui.count.textContent=count.toLocaleString();return count}
function resetWorld(){cells.fill(E);burn.fill(0);processed.fill(0);reactionCount=0;age=0;ui.reactions.textContent='0';lastAge=performance.now();for(let x=0;x<W;x++){set(x,H-2,STONE);if(x%13<7)set(x,H-3,SAND)}for(let x=12;x<42;x++)for(let y=H-19;y<H-3;y++)if(Math.random()<.68)set(x,y,SAND);for(let x=53;x<83;x++)for(let y=H-10;y<H-3;y++)if(Math.random()<.68)set(x,y,WATER);for(let x=103;x<121;x++)for(let y=H-11;y<H-3;y++)if(Math.random()<.65)set(x,y,WOOD);for(let i=0;i<32;i++){const x=104+Math.floor(Math.random()*15),y=H-12-Math.floor(Math.random()*6);set(x,y,PLANT)}for(let x=150;x<174;x++)for(let y=H-13;y<H-3;y++)if(Math.random()<.62)set(x,y,STONE);notify('Fresh world generated');render()}
function quick(type){if(type==='rain'){for(let i=0;i<300;i++){const x=Math.floor(Math.random()*W),y=Math.floor(Math.random()*Math.max(10,H*.25));set(x,y,WATER);if(i%10===0)spawnFX(x,y,'water',2)}reaction('Rainfall started')}
if(type==='ignite'){for(let i=0;i<14;i++){const x=103+Math.floor(Math.random()*22),y=H-5-Math.floor(Math.random()*7);set(x,y,FIRE);spawnFX(x,y,'fire',3)}reaction('Ignition: watch nearby materials react')}
if(type==='garden'){for(let i=0;i<70;i++){const x=10+Math.floor(Math.random()*(W-20)),y=H-4-Math.floor(Math.random()*15);if(empty(x,y)||get(x,y)===SAND)set(x,y,PLANT);if(i%8===0)spawnFX(x,y,'plant',2)}for(let i=0;i<45;i++){const x=10+Math.floor(Math.random()*(W-20)),y=H-5-Math.floor(Math.random()*9);if(empty(x,y))set(x,y,WATER)}reaction('A little life has entered the world')}}
$('rain').addEventListener('click',()=>{spawnFX(W*.5,4,'water',16);quick('rain')});$('ignite').addEventListener('click',()=>{spawnFX(W*.5,H*.7,'fire',18);quick('ignite')});$('garden').addEventListener('click',()=>{spawnFX(W*.5,H*.75,'plant',14);quick('garden')});$('reset').addEventListener('click',()=>{playSfx('ui');fxParticles=[];resetWorld()});
$('sfx').addEventListener('click',()=>{audioEnabled=!audioEnabled;if(audioEnabled){initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();$('sfx').classList.add('sound-on');$('sfx').setAttribute('aria-label','Turn sound effects off');$('sfx').title='Sound effects on';notify('Sound effects enabled');playSfx('select')}else{$('sfx').classList.remove('sound-on');$('sfx').setAttribute('aria-label','Turn sound effects on');$('sfx').title='Sound effects off';notify('Sound effects disabled')}});
$('pause').addEventListener('click',()=>{paused=!paused;ui.state.textContent=paused?'PAUSED':'LIVE';ui.pause.classList.toggle('active',paused);ui.pause.setAttribute('aria-label',paused?'Resume simulation':'Pause simulation');ui.pauseIcon.innerHTML=paused?'<path d="m8 5 11 7-11 7z"/>':'<path d="M7 5h4v14H7zM15 5h4v14h-4z"/>';notify(paused?'Simulation paused':'Simulation resumed')});
$('speed').addEventListener('click',()=>{speed=speed%4+1;$('speed').textContent=speed+'×';notify('Simulation speed '+speed+'×')});
$('continuePortrait').addEventListener('click',()=>{forcePortrait=true;$('orientation').style.display='none';notify('Portrait mode enabled')});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(e.target.tagName)){e.preventDefault();ui.pause.click()}if(e.key==='1')choose(SAND);if(e.key==='2')choose(WATER);if(e.key==='3')choose(STONE);if(e.key==='4')choose(WOOD);if(e.key==='5')choose(FIRE);if(e.key==='6')choose(PLANT);if(e.key==='7')choose(OIL);if(e.key==='8')choose(ACID);if(e.key==='9')choose(LAVA);if(e.key==='Escape')choose(ERASER)});
let first=true;
function loop(now){requestAnimationFrame(loop);if(!paused)simulate();render();ambientFX();renderFX();frameCount++;if(now-lastFps>900){ui.fps.textContent=Math.round(frameCount*1000/(now-lastFps));frameCount=0;lastFps=now}if(now-lastAge>1000){age++;lastAge=now}if(first){first=false;ui.hint.classList.add('show');setTimeout(()=>ui.hint.classList.remove('show'),3500)}}
resetWorld();requestAnimationFrame(loop);
})();
</script>
